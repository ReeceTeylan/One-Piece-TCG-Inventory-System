name: OP Vault Uptime Check
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public storefront frontend
        run: curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --connect-timeout 20 --max-time 55 'https://op-vault-web.vercel.app/' --output /dev/null
      - name: Check API plus database readiness
        env:
          API_HEALTH: ${{ vars.OP_VAULT_API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH" ]; then
            API_HEALTH='https://one-piece-tcg-inventory-system.onrender.com/api/health/db'
            echo "Checking OP Vault's verified Render API/database health endpoint."
          fi
          case "$API_HEALTH" in https://*) ;; *) echo "Health URL must use HTTPS"; exit 1 ;; esac
          curl --fail --silent --show-error --location --retry 2 --retry-delay 8 --connect-timeout 25 --max-time 95 "$API_HEALTH" --output /dev/null
