name: Validate image lookup
on:
  push:
    branches: [fix/yuyu-tcg-artwork-import-20261024]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: op-vault-api
      - run: npm ci && npm run build
        working-directory: op-vault-web
