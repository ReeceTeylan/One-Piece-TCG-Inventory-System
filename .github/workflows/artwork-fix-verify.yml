name: Validate image lookup
on:
  push:
    branches: [fix/yuyu-tcg-artwork-import-20261024]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: op-vault-api
      - run: npm ci && npm run build
        working-directory: op-vault-web
