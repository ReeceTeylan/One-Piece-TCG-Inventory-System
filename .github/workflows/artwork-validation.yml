name: Artwork cross-check validation
on:
  push:
    branches:
      - feat/artwork-crosscheck-new-cards-20261024
permissions:
  contents: read
jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build API
        working-directory: op-vault-api
        run: |
          npm ci
          npm run build
      - name: Build web
        working-directory: op-vault-web
        run: |
          npm ci
          npm run build
