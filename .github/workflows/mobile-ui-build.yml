name: Mobile UI build validation
on:
  push:
    branches:
      - fix/mobile-ui-polish-20261023
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: op-vault-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: op-vault-web/package-lock.json
      - run: npm ci
      - run: npm run build
