name: Integrity CI
on:
  push:
    branches: [feat/inventory-integrity-20261024]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - run: npm ci && npm run build
        working-directory: op-vault-web
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - run: npm ci && npm run build && npm test -- --runInBand --passWithNoTests
        working-directory: op-vault-api
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opvault_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: opvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opvault_test -d opvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://opvault_test:test_only_password@localhost:5432/opvault_test?schema=public
      DIRECT_URL: postgresql://opvault_test:test_only_password@localhost:5432/opvault_test?schema=public
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - run: npm ci
        working-directory: op-vault-api
      - name: Diagnose old migration baseline drift
        working-directory: op-vault-api
        run: |
          mv prisma/migrations/20261024000100_inventory_variants_receipts_sale_sequence /tmp/op-vault-new-migration
          npx prisma migrate deploy
          mv /tmp/op-vault-new-migration prisma/migrations/20261024000100_inventory_variants_receipts_sale_sequence
          git fetch --depth=1 origin main
          git show origin/main:op-vault-api/prisma/schema.prisma > /tmp/main-prisma-schema.prisma
          cp /tmp/main-prisma-schema.prisma prisma/schema.base.prisma
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.base.prisma --script > /tmp/op-vault-baseline.sql
          echo "=== ORIGINAL MIGRATION / CURRENT MAIN SCHEMA DIFFERENCES ==="
          cat /tmp/op-vault-baseline.sql
      - run: npx prisma migrate deploy
        working-directory: op-vault-api
      - name: Check migration/schema parity
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script --exit-code
        working-directory: op-vault-api
