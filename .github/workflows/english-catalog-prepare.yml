name: Prepare English Card Catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 1 * *'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyarrow==20.0.0'
      - run: python scripts/prepare-english-catalog.py --output data/english-catalog.json
        working-directory: op-vault-api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-catalog-review
          path: |
            op-vault-api/data/english-catalog.json
            op-vault-api/data/english-catalog.manifest.json
            op-vault-api/data/english-catalog.unresolved.json
          retention-days: 30
